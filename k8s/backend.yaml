apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photowall-photos
  namespace: photowall
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: photowall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photowall
      component: backend
  template:
    metadata:
      labels:
        app: photowall
        component: backend
    spec:
      containers:
        - name: backend
          image: photowall-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: photowall-config
          volumeMounts:
            - name: photos
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: photowall-photos
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: photowall
spec:
  selector:
    app: photowall
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
