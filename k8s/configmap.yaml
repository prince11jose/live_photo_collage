apiVersion: v1
kind: ConfigMap
metadata:
  name: photowall-config
  namespace: photowall
data:
  COLLAGE_TITLE: "Live Photo Collage"
  PHOTOS_DIR: "/data/photos"
  FLASK_HOST: "0.0.0.0"
  FLASK_PORT: "5000"
  # Client IDs are public identifiers, not secrets - safe to hold in a ConfigMap.
  # Every board is owned by a signed-in Google account, so this must be set for the app to work.
  GOOGLE_CLIENT_ID: "520360783242-nhtep74ugo25vuaq69i2lktg06v2vi60.apps.googleusercontent.com"
  # Comma-separated emails allowed to see the "Manage users" directory across all boards,
  # and that inherit any pre-existing/legacy photos on first sign-in.
  ADMIN_EMAILS: "prince@movingwalls.com"
