apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: photowall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photowall
      component: frontend
  template:
    metadata:
      labels:
        app: photowall
        component: frontend
    spec:
      containers:
        - name: frontend
          image: photowall-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: photowall
spec:
  type: NodePort
  selector:
    app: photowall
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30105
